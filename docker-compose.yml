version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: marketing_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketing_backend
    ports:
      - "8000:8000"  # FastAPI
      - "6080:6080"  # noVNC Web Interface
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Default backend URL from client browser's perspective
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: marketing_frontend
    ports:
      - "80:80"      # Web App Dashboard
    depends_on:
      - backend
    restart: unless-stopped
